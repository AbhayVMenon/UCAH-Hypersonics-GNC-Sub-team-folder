<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Q4 6DOF Build Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style id="css">
:root{
  color-scheme: light;
  --ground:#EEF1F0; --surface:#FFFFFF; --sunk:#E4E9E7; --hover:#F3F6F5;
  --ink:#17211F; --muted:#56625E; --faint:#76827E; --rule:#D3DAD7; --rule-strong:#B3BEBA;
  --gold:#CFB991; --gold-soft:#F4ECDA; --gold-ink:#75582A; --on-gold:#241B0B;
  --good:#2F7A4F; --good-soft:#E1F0E6; --on-good:#FFFFFF;
  --wait:#8A5A00; --wait-soft:#FAEFD7;
  --bad:#B63A26;
  --focus:#1F6FB2;
  --mat:#FFFFFF;
  --shadow:0 1px 0 rgba(23,33,31,.03), 0 2px 6px rgba(23,33,31,.05);
  --f-display:"Barlow Semi Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ground:#0F1413; --surface:#161C1A; --sunk:#1F2725; --hover:#1B2220;
    --ink:#E3E9E6; --muted:#A3AEAA; --faint:#84908C; --rule:#2A3330; --rule-strong:#44504C;
    --gold:#CFB991; --gold-soft:#2D271B; --gold-ink:#DCC592; --on-gold:#241B0B;
    --good:#6CC592; --good-soft:#16301F; --on-good:#0C1A12;
    --wait:#E3B55A; --wait-soft:#30260F;
    --bad:#F08A76;
    --focus:#7DB6E8;
    --mat:#F2F4F3;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ground:#0F1413; --surface:#161C1A; --sunk:#1F2725; --hover:#1B2220;
  --ink:#E3E9E6; --muted:#A3AEAA; --faint:#84908C; --rule:#2A3330; --rule-strong:#44504C;
  --gold:#CFB991; --gold-soft:#2D271B; --gold-ink:#DCC592; --on-gold:#241B0B;
  --good:#6CC592; --good-soft:#16301F; --on-good:#0C1A12;
  --wait:#E3B55A; --wait-soft:#30260F;
  --bad:#F08A76;
  --focus:#7DB6E8;
  --mat:#F2F4F3;
  --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion: no-preference){html{scroll-behavior:smooth}}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 var(--f-body)}
[hidden]{display:none!important}
img{max-width:100%;height:auto}
a{color:var(--gold-ink);text-decoration-thickness:1px;text-underline-offset:3px}
a:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:6px}
code{font:500 .86em/1.3 var(--f-mono);background:var(--sunk);padding:.1em .36em;border-radius:5px;overflow-wrap:anywhere}
cite{font-style:italic}
b{font-weight:600}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.wrap{max-width:1120px;margin:0 auto;padding-inline:20px;padding-block:32px 56px}

/* header */
.top{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:28px;align-items:start;margin-bottom:24px}
@media (max-width:860px){.top{grid-template-columns:1fr;gap:20px}}
.eyebrow{font:600 12.5px/1.2 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--gold-ink);margin:0 0 10px}
h1{font:700 clamp(36px,5.2vw,52px)/1 var(--f-display);letter-spacing:-.005em;margin:0 0 14px;text-wrap:balance}
.lede{max-width:60ch;color:var(--muted);margin:0 0 16px;font-size:16px}
.lede b{color:var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.meta span{font:500 13px/1 var(--f-body);padding:7px 11px;border:1px solid var(--rule);border-radius:999px;color:var(--muted);background:var(--surface)}
.meta b{color:var(--ink)}

.panel{background:var(--surface);border:1px solid var(--rule);border-radius:14px;box-shadow:var(--shadow)}
.overall{padding:18px 20px 18px;display:grid;gap:10px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.cap{font:600 12px/1.2 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.big{font:700 44px/1 var(--f-display);font-variant-numeric:tabular-nums}
.big small{font-size:24px;color:var(--faint);font-weight:600}
.bar{display:block;height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:inherit;transition:width .25s ease}
.bar.full i{background:var(--good)}
.chip{display:inline-flex;align-items:center;gap:7px;font:500 12.5px/1.2 var(--f-body);color:var(--muted)}
.chip::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--faint)}
.chip[data-s="saved"]::before{background:var(--good)}
.chip[data-s="dirty"]::before,.chip[data-s="saving"]::before{background:var(--gold)}
.chip[data-s="error"]{color:var(--bad)}
.chip[data-s="error"]::before{background:var(--bad)}
.next{border-top:1px solid var(--rule);padding-top:14px;margin-top:4px}
.next .nt{font-weight:600;font-size:16.5px;line-height:1.4;margin:6px 0 4px}
.next .nd{font-size:13.5px;color:var(--muted);margin:0 0 8px}
.next a{font-weight:500;font-size:14px}

/* step overview */
.snav-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin:0 0 28px;padding:0;list-style:none}
@media (max-width:980px){.snav-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:540px){.snav-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.snav{display:flex;flex-direction:column;gap:7px;height:100%;padding:12px 12px 11px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);color:inherit;text-decoration:none}
.snav:hover{border-color:var(--rule-strong)}
.snav .k{font:600 11.5px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.snav .n{font:600 18px/1.1 var(--f-display);color:var(--ink)}
.snav .d{display:flex;justify-content:space-between;gap:6px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.snav.is-current{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.snav.is-current .k{color:var(--gold-ink)}
.snav.is-done .k{color:var(--good)}

/* big picture */
.bigpic{margin:0 0 30px}
.bigpic summary{display:inline-flex;align-items:center;gap:8px;cursor:pointer;list-style:none;font:600 16px/1.2 var(--f-display);letter-spacing:.02em;padding:9px 13px;border:1px solid var(--rule);border-radius:9px;background:var(--surface)}
.bigpic summary::-webkit-details-marker{display:none}
.bigpic summary::before{content:"";width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(-45deg);transition:transform .15s}
.bigpic[open] summary::before{transform:rotate(45deg) translate(-2px,-1px)}
.bigpic figure{margin:12px 0 0;max-width:720px}
.mat{background:var(--mat);border:1px solid var(--rule);border-radius:12px;padding:10px}
.mat img{display:block;width:100%;height:auto}
.bigpic figcaption{margin-top:8px;font-size:13px;color:var(--muted)}

/* steps */
.step{background:var(--surface);border:1px solid var(--rule);border-radius:16px;padding:22px 24px 20px;margin-bottom:18px;scroll-margin-top:16px;box-shadow:var(--shadow)}
@media (max-width:540px){.step{padding:18px 16px 16px}}
.step.is-current{border-color:var(--gold)}
.step-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:start}
@media (max-width:640px){.step-head{grid-template-columns:auto minmax(0,1fr)}.step-status{grid-column:1/-1}}
.step-num{width:50px;height:50px;border-radius:12px;display:grid;place-items:center;font:700 28px/1 var(--f-display);background:var(--sunk);color:var(--muted)}
.step.is-current .step-num{background:var(--gold);color:var(--on-gold)}
.step.is-done .step-num{background:var(--good-soft);color:var(--good)}
.step h2{font:700 26px/1.08 var(--f-display);margin:1px 0 7px;text-wrap:balance}
.step-meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin:0 0 8px;color:var(--muted);font-size:13.5px}
.step-meta b{color:var(--ink)}
.files{display:flex;flex-wrap:wrap;gap:6px}
.files code{font-size:12px}
.step-status{display:grid;justify-items:end;gap:7px;min-width:160px}
@media (max-width:640px){.step-status{justify-items:stretch;grid-template-columns:auto 1fr auto;align-items:center;min-width:0}}
.step-status .bar{width:160px}
@media (max-width:640px){.step-status .bar{width:auto}}
.pill{font:600 12px/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap;justify-self:end}
@media (max-width:640px){.pill{justify-self:start}}
.pill.prog{background:var(--gold-soft);color:var(--gold-ink)}
.pill.done{background:var(--good-soft);color:var(--good)}
.pill.wait{background:var(--wait-soft);color:var(--wait)}
.count{font:600 14px/1 var(--f-body);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.done-when,.waiting{margin:16px 0 0;padding:12px 14px;border-radius:10px;font-size:15px}
.done-when{background:var(--sunk)}
.waiting{margin-top:8px;background:var(--wait-soft);font-size:14px}
.lbl{display:inline-block;font:600 12px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink);margin-right:9px}
.waiting .lbl{color:var(--wait)}

.step-body{display:grid;grid-template-columns:minmax(0,1.12fr) minmax(0,1fr);gap:30px;margin-top:18px}
@media (max-width:860px){.step-body{grid-template-columns:1fr;gap:20px}}
.col-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:700 13px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px;padding-bottom:9px;border-bottom:1px solid var(--rule)}
.col-h .lc{font:500 12.5px/1 var(--f-body);letter-spacing:0;text-transform:none;color:var(--faint);font-variant-numeric:tabular-nums}
.sub{font:600 12px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin:14px 0 4px;padding-left:6px}

/* checklist rows */
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:1px}
.task{position:relative;display:grid;grid-template-columns:22px minmax(0,1fr);gap:11px;align-items:start;padding:7px 6px;border-radius:8px;cursor:pointer}
.task:hover{background:var(--hover)}
.task input{position:absolute;left:6px;top:7px;width:22px;height:22px;margin:0;opacity:0;cursor:pointer}
.task input:disabled{cursor:default}
.tick{width:20px;height:20px;margin-top:1px;border:1.5px solid var(--rule-strong);border-radius:5px;background:var(--surface);display:grid;place-items:center;transition:background .15s,border-color .15s}
.tick::after{content:"";width:10px;height:5px;border-left:2px solid var(--on-gold);border-bottom:2px solid var(--on-gold);transform:translateY(-1px) rotate(-45deg);opacity:0}
.task input:checked + .tick{background:var(--gold);border-color:var(--gold)}
.task input:checked + .tick::after{opacity:1}
.task input:focus-visible + .tick{outline:2px solid var(--focus);outline-offset:2px}
.task .t{display:block}
.task input:checked ~ .tt .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--rule-strong)}
.task .d{display:block;font-size:13.5px;line-height:1.5;color:var(--muted);margin-top:2px}
li.star .t{font-weight:600}
li.star .tt::before{content:"MVP";display:inline-block;font:700 10.5px/1 var(--f-display);letter-spacing:.1em;color:var(--on-gold);background:var(--gold);border-radius:4px;padding:3px 5px 2px;margin-bottom:4px}
.learn .tick{border-radius:50%}
.learn .tick::after{border-color:var(--on-good)}
.learn .task input:checked + .tick{background:var(--good);border-color:var(--good)}
.learn .t{font-weight:600}
.learn .task input:checked ~ .tt .t{text-decoration:none;color:var(--ink)}
.src{margin:-3px 0 8px 39px;font-size:12.5px;line-height:1.5;color:var(--faint)}
.src .w{font:600 11px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;margin-right:6px}
.readonly .task{cursor:default}
.readonly .task:hover{background:transparent}

/* bookshelf */
.shelf{margin-top:34px}
.shelf-lede{margin:4px 0 0;color:var(--muted);font-size:14px}
.shelf-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:32px;list-style:none;padding:0;margin:14px 0 0}
@media (max-width:760px){.shelf-grid{grid-template-columns:1fr}}
.shelf-grid li{padding:13px 0 12px;border-top:1px solid var(--rule)}
.shelf .st{font:600 11.5px/1 var(--f-display);letter-spacing:.09em;text-transform:uppercase;color:var(--gold-ink)}
.shelf .bk{margin:5px 0 2px;font-weight:600}
.shelf .by{font-weight:400;color:var(--muted)}
.shelf .for{margin:0;font-size:13.5px;color:var(--muted)}

.foot{margin-top:30px;padding-top:14px;border-top:1px solid var(--rule);color:var(--faint);font-size:12.5px;max-width:70ch}

@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>

        var title = b.href ? '<a href="' + esc(b.href) + '" target="_blank" rel="noopener"><cite>' + esc(b.bk) + "</cite></a>" : "<cite>" + esc(b.bk) + "</cite>";
        if (b.bk.indexOf("(") !== -1 || b.bk.indexOf("ARL") === 0) title = b.href ? '<a href="' + esc(b.href) + '" target="_blank" rel="noopener">' + esc(b.bk) + "</a>" : esc(b.bk);
        return '<li><span class="st">' + esc(b.st) + '</span><p class="bk">' + title + (b.by ? ' <span class="by">— ' + esc(b.by) + "</span>" : "") + '</p><p class="for">' + fmt(b.f) + "</p></li>";
      }).join("") + "</ul></section>";
  }

  function footHTML() {
    return '<p class="foot">Your checks save to this page. About a second after you tick a box, the page saves a new version and reloads where you were. Target dates leave two weeks before Dec 1 for the write-up.</p>';
  }

  function render() {
    app.innerHTML = headerHTML() + navHTML() + (FIG ? figHTML() : "") +
      PLAN.map(stepHTML).join("") + shelfHTML() + footHTML();
    app.classList.toggle("readonly", readOnly);
    updateAll();
  }

  function setBar(el, n, total) {
    if (!el) return;
    el.firstChild.style.width = (total ? Math.round(100 * n / total) : 0) + "%";
    el.classList.toggle("full", total > 0 && n === total);
  }

  function updateAll() {
    var all = 0, got = 0, next = null, nextStep = null;
    PLAN.forEach(function (s) {
      var items = s.build.concat(s.tests);
      var n = count(items);
      all += items.length; got += n;
      if (!next) {
        for (var i = 0; i < items.length; i++) {
          if (!done.has(items[i].id)) { next = items[i]; nextStep = s; break; }
        }
      }
      var st = n === items.length ? ["done", "Done"] : n > 0 ? ["prog", "In progress"] : s.waiting ? ["wait", "Needs team data"] : ["", "Not started"];
      var pill = $("pill-" + s.n);
      pill.className = "pill " + st[0];
      pill.textContent = st[1];
      $("cnt-" + s.n).textContent = n + " / " + items.length;
      setBar($("bar-" + s.n), n, items.length);
      $("lc-" + s.n).textContent = count(s.learn) + " / " + s.learn.length + " read";
      var nav = $("nav-" + s.n);
      nav.querySelector(".c").textContent = n + " / " + items.length;
      setBar(nav.querySelector(".bar"), n, items.length);
      nav.classList.toggle("is-done", n === items.length);
      $("step-" + s.n).classList.toggle("is-done", n === items.length);
    });
    PLAN.forEach(function (s) {
      var cur = s === nextStep;
      $("step-" + s.n).classList.toggle("is-current", cur);
      $("nav-" + s.n).classList.toggle("is-current", cur);
      if (cur) $("nav-" + s.n).setAttribute("aria-current", "step"); else $("nav-" + s.n).removeAttribute("aria-current");
    });
    $("ov-num").innerHTML = got + "<small> / " + all + "</small>";
    setBar($("ov-bar"), got, all);
    var nx = $("next");
    if (next) {
      nx.innerHTML = '<span class="cap">Next up · Step ' + nextStep.n + "</span>" +
        '<p class="nt">' + fmt(next.t) + "</p>" +
        (next.d ? '<p class="nd">' + fmt(next.d) + "</p>" : "") +
        '<a href="#step-' + nextStep.n + '">Go to Step ' + nextStep.n + "</a>";
    } else {
      nx.innerHTML = '<span class="cap">All six steps done</span><p class="nt">Send the Q4 report to the RE and the load cases to Structures.</p>';
    }
  }

  function setChip(state, text) {
    var el = $("save");
    if (!el) return;
    el.setAttribute("data-s", state);
    el.textContent = text;
  }

  function idleChip() {
    if (readOnly) setChip("readonly", "View only: checks aren’t saved");
    else if (saved.updated) setChip("saved", "Saved " + when(saved.updated));
    else setChip("idle", "Checks save to this page");
  }

  // ---------- saving ----------
  function buildDoc() {
    var state = JSON.stringify({ done: Array.from(done).sort(), updated: new Date().toISOString() }).replace(/</g, "\\u003c");
    return "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n" +
      "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n" +
      "<title>" + TITLE + "</title>\n" + FONTS + "\n" +
      "<style id=\"css\">" + CSS_SRC + "</style>\n</head>\n<body>\n" +
      "<main id=\"app\" class=\"wrap\"></main>\n" +
      "<script type=\"application/json\" id=\"state\">" + state + "<\/script>\n" +
      "<script type=\"text/plain\" id=\"fig-src\">" + FIG + "<\/script>\n" +
      "<script id=\"main\">" + JS_SRC + "<\/script>\n</body>\n</html>\n";
  }

  function openDetails() {
    var ids = [];
    document.querySelectorAll("details[id]").forEach(function (d) { if (d.open) ids.push(d.id); });
    return ids;
  }

  function stash() {
    try { sessionStorage.setItem(RESTORE_KEY, JSON.stringify({ y: window.scrollY, open: openDetails(), at: Date.now() })); } catch (e) {}
  }
  function unstash() {
    try { sessionStorage.removeItem(RESTORE_KEY); } catch (e) {}
  }
  function restore() {
    var r = null;
    try { r = JSON.parse(sessionStorage.getItem(RESTORE_KEY) || "null"); } catch (e) {}
    unstash();
    if (!r || Date.now() - r.at > 120000) return;
    (r.open || []).forEach(function (id) { var d = $(id); if (d) d.open = true; });
    window.scrollTo({ top: r.y || 0, behavior: "instant" });
    setChip("saved", "Saved");
  }

  function goReadOnly() {
    readOnly = true;
    dirty = false;
    done = new Set(saved.done || []);
    app.classList.add("readonly");
    document.querySelectorAll("input[data-id]").forEach(function (cb) {
      cb.checked = done.has(cb.getAttribute("data-id"));
      cb.disabled = true;
    });
    updateAll();
    idleChip();
  }

  function scheduleSave(delay) {
    dirty = true;
    if (capState === "absent") { setChip("local", "Not saved in this view"); return; }
    setChip("dirty", "Unsaved changes");
    clearTimeout(timer);
    timer = setTimeout(save, delay || 1200);
  }

  function save() {
    timer = null;
    if (!dirty || saving || readOnly) return;
    if (capState === "pending") { timer = setTimeout(save, 800); return; }
    if (!artifactApi) { setChip("local", "Not saved in this view"); return; }
    saving = true;
    setChip("saving", "Saving…");
    stash();
    artifactApi.publish(buildDoc()).then(function () {
      saving = false;
      dirty = false;
      setChip("saved", "Saved");
    }, function (err) {
      saving = false;
      var code = err && err.code;
      if (code === "conflict") {
        setChip("saving", "Loading the newest version…");
        return;
      }
      unstash();
      if (["not_writer", "not_granted", "consent_required", "capability_disabled", "capability_removed", "not_declared"].indexOf(code) !== -1) {
        goReadOnly();
      } else if (code === "rate_limited") {
        if (!rateRetried) {
          rateRetried = true;
          setChip("dirty", "Saving paused, trying again shortly");
          timer = setTimeout(save, 20000);
        } else {
          rateRetried = false;
          setChip("error", "Couldn’t save yet. Tick a box to try again.");
        }
      } else if (["too_large", "invalid_content", "transform_error", "read_only_path"].indexOf(code) !== -1) {
        setChip("error", "This page couldn’t be saved");
      } else {
        if (!upstreamRetried) {
          upstreamRetried = true;
          setChip("saving", "Retrying…");
          timer = setTimeout(save, 1000 + Math.random() * 2000);
        } else {
          upstreamRetried = false;
          setChip("error", "Couldn’t save. Tick a box to try again.");
        }
      }
    });
  }

  app.addEventListener("change", function (e) {
    var cb = e.target;
    if (!cb || !cb.matches || !cb.matches("input[type=checkbox][data-id]")) return;
    if (readOnly) { cb.checked = !cb.checked; return; }
    var id = cb.getAttribute("data-id");
    if (cb.checked) done.add(id); else done.delete(id);
    updateAll();
    scheduleSave();
  });

  document.addEventListener("visibilitychange", function () {
    if (document.visibilityState === "hidden" && dirty && timer && capState === "ready") {
      clearTimeout(timer);
      save();
    }
  });

  // ---------- boot ----------
  render();
  idleChip();
  restore();

  try {
    if (window.claude && typeof window.claude.use === "function") {
      window.claude.use("artifact").then(function (ns) {
        artifactApi = ns;
        capState = ns ? "ready" : "absent";
        if (!ns && dirty) setChip("local", "Not saved in this view");
      }, function () {
        capState = "absent";
        if (dirty) setChip("local", "Not saved in this view");
      });
    } else {
      capState = "absent";
    }
  } catch (e) {
    capState = "absent";
  }
})();
</script>
</body>
</html>
